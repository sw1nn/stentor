[package]
name = "stentor"
version = "0.30.0"
edition = "2024"
authors = ["Neale Swinnerton <neale@sw1nn.com>"]
description = "Real-time voice transcription with Whisper"
license = "GPL-3.0"
default-run = "stentord"

[[bin]]
name = "stentord"
path = "src/bin/stentord.rs"

[[bin]]
name = "stentorctl"
path = "src/bin/client.rs"

[dependencies]
# UI
gtk4 = "0.10"
libadwaita = "0.8"
glib = "0.21"

# Audio
hound = "3.5"
libpulse-binding = "2.30"
libpulse-simple-binding = "2.28"

# Transcription
whisper-rs = { version = "0.15", features = ["vulkan", "openmp"] }

# HTTP client for downloading models
reqwest = { version = "0.12", features = ["blocking", "stream"] }
indicatif = "0.18"

# Async runtime
tokio = { version = "1.52", features = ["full"] }
async-channel = "2.5"

# Synchronization
parking_lot = "0.12"

# Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
xdg = "3.0"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Pattern matching
regex = "1.12"

# Image generation for slot number overlays
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
fontconfig = "0.10"

# Base64 encoding for kitty image protocol
base64 = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

# Signal handling
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

[features]
default = []
whisper-tracing-backend = ["whisper-rs/tracing_backend"]

[dev-dependencies]
scopeguard = "1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
