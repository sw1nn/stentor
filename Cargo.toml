[package]
name = "stentor"
version = "0.12.0"
edition = "2024"
authors = ["Neale Swinnerton <neale@sw1nn.com>"]
description = "Real-time voice transcription with Whisper"
license = "GPL-3.0"
default-run = "stentord"

[[bin]]
name = "stentord"
path = "src/bin/stentord.rs"

[[bin]]
name = "stentorctl"
path = "src/bin/client.rs"

[dependencies]
# UI
gtk4 = "0.10"
libadwaita = "0.8"
glib = "0.21"

# Audio
hound = "3.5"
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"

# Transcription
whisper-rs = "0.15"

# HTTP client for downloading models
reqwest = { version = "0.12", features = ["blocking", "stream"] }
indicatif = "0.18"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-channel = "2.5"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
xdg = "3.0"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

# Signal handling
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

[dev-dependencies]
scopeguard = "1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
